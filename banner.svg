<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39d353" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#56d364"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="898" height="218" rx="14"/></clipPath>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="218" rx="14" fill="none" stroke="#21262d" stroke-width="1.5"/>

  <!-- scanline sweep -->
  <g clip-path="url(#frame)">
    <rect x="0" y="-40" width="900" height="28" fill="url(#glow)" opacity="0.25">
      <animate attributeName="y" values="-40;240;-40" dur="5s" repeatCount="indefinite"/>
    </rect>
    <!-- subtle grid -->
    <g stroke="#161b22" stroke-width="1" opacity="0.7">
      <line x1="0" y1="55" x2="900" y2="55"/>
      <line x1="0" y1="110" x2="900" y2="110"/>
      <line x1="0" y1="165" x2="900" y2="165"/>
      <line x1="180" y1="0" x2="180" y2="220"/>
      <line x1="450" y1="0" x2="450" y2="220"/>
      <line x1="720" y1="0" x2="720" y2="220"/>
    </g>
  </g>

  <!-- window chrome -->
  <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="28" r="6" fill="#27c93f"/>
  <text x="95" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">octodev — session</text>

  <!-- prompt + typing -->
  <text x="40" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#3fb950" filter="url(#softGlow)">$</text>
  <text x="68" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="url(#textGrad)" filter="url(#softGlow)">
    <tspan>whoami</tspan>
  </text>
  <rect x="155" y="78" width="10" height="22" fill="#56d364">
    <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>

  <text x="40" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#c9d1d9">
    <tspan fill="#8b949e">&gt;</tspan> Lou · systems engineer &amp; driver tinkerer
  </text>
  <text x="40" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">
    <tspan fill="#58a6ff">kernel</tspan>
    <tspan> · </tspan>
    <tspan fill="#58a6ff">audio</tspan>
    <tspan> · </tspan>
    <tspan fill="#58a6ff">firmware</tspan>
    <tspan> · </tspan>
    <tspan fill="#58a6ff">hackintosh</tspan>
    <tspan> · France</tspan>
  </text>

  <!-- status pulse -->
  <circle cx="850" cy="185" r="5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="820" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#3fb950" text-anchor="end">online</text>
</svg>
